# Publishes the site to GitHub Pages on every push to main.
# The data is built locally (node scripts/build-data.mjs) and committed, so
# this workflow never calls tarkov.dev or the wiki. It only copies files.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Collect the files the page needs
        run: |
          mkdir -p _site/maps
          cp site/index.html site/data.js site/icons.js _site/
          cp site/maps/*.js _site/maps/
          touch _site/.nojekyll

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
